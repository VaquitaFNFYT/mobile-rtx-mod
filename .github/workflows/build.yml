name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Geode SDK Path
        run: |
          echo "GEODE_SDK=$HOME/.local/share/geode/sdk" >> $GITHUB_ENV

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          build-config: Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-android
          path: build/*.geode
