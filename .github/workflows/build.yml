name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nsetup/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Setup Geode CLI
        run: |
          wget https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.zip
          unzip geode-cli-linux.zip -d $HOME/.geode/bin
          echo "$HOME/.geode/bin" >> $GITHUB_PATH

      - name: Configure and Build Mod
        run: |
          geode sdk install
          geode build --platform android

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-android
          path: build/*.geode
