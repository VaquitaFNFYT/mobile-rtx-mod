name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Geode CLI
        uses: geode-sdk/setup-geode@v1

      - name: Setup SDK Profile
        run: |
          mkdir -p $HOME/fake-gd
          geode profile add --name default $HOME/fake-gd android64
          geode sdk install

      - name: Build Mod
        run: |
          geode build -p android --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-android
          path: build/*.geode
