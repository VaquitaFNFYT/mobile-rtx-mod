name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CLI & SDK
        run: |
          mkdir -p $HOME/.geode/bin
          curl -s https://api.github.com/repos/geode-sdk/cli/releases/latest | grep "browser_download_url.*linux" | cut -d : -f 2,3 | tr -d \" | xargs wget -O $HOME/geode-cli.zip
          unzip $HOME/geode-cli.zip -d $HOME/.geode/bin
          echo "$HOME/.geode/bin" >> $GITHUB_PATH
          $HOME/.geode/bin/geode sdk install

      - name: Build Android
        run: |
          geode build -p android --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-android
          path: build/*.geode
