name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Geode SDK
        run: |
          git clone --recursive https://github.com/geode-sdk/geode.git $HOME/geode-sdk

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: $HOME/geode-sdk
          target: Android64
          build-config: Release
