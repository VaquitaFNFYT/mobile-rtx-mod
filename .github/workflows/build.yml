name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Geode CLI
        uses: geode-sdk/cli-setup-action@v2

      - name: Setup SDK & Environment
        run: |
          geode profile add --name default /tmp android64
          geode sdk install
          echo "GEODE_SDK=$HOME/.local/share/geode/sdk" >> $GITHUB_ENV

      - name: Build Mod
        run: |
          geode build -p android --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-android
          path: build/*.geode
