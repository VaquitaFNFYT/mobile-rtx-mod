name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nsetup/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Download Geode SDK
        run: |
          gh release download v3.0.0 --repo geode-sdk/geode --pattern "*.zip" --dir $HOME/geode-sdk || true
          git clone --recursive https://github.com/geode-sdk/geode $HOME/geode-sdk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DGEODE_SDK=$HOME/geode-sdk

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-android
          path: build/*.geode
