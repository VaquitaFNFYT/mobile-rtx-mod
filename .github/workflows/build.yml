name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode CLI & SDK
        uses: geode-sdk/setup-geode@v2
        with:
          sdk-version: 'v3.0.0'

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@v2
        with:
          target: android
